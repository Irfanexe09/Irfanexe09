<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 220" width="100%" height="220" fill="none">
  <defs>
    <!-- Deep Ocean & Nautical Gradients -->
    <linearGradient id="oceanDeep" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#071116"/>
      <stop offset="50%" stop-color="#0B1922"/>
      <stop offset="100%" stop-color="#09141B"/>
    </linearGradient>

    <!-- Antique Gold Gradient -->
    <linearGradient id="antiqueGold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9C7A3C"/>
      <stop offset="30%" stop-color="#D6AD60"/>
      <stop offset="70%" stop-color="#F5EBD5"/>
      <stop offset="100%" stop-color="#C59B46"/>
    </linearGradient>

    <!-- Dark Wood Trim Gradient -->
    <linearGradient id="darkWood" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2D1D16"/>
      <stop offset="50%" stop-color="#422B20"/>
      <stop offset="100%" stop-color="#261812"/>
    </linearGradient>

    <!-- Border Glow -->
    <linearGradient id="borderGild" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D6AD60" stop-opacity="0.8"/>
      <stop offset="35%" stop-color="#422B20" stop-opacity="0.9"/>
      <stop offset="70%" stop-color="#1D6465" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#D6AD60" stop-opacity="0.8"/>
    </linearGradient>

    <!-- Nautical Chart Grid Pattern -->
    <pattern id="chartGrid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M 36 0 L 0 0 0 36" fill="none" stroke="#1D6465" stroke-width="0.5" stroke-opacity="0.25"/>
      <circle cx="36" cy="36" r="0.75" fill="#D6AD60" fill-opacity="0.3"/>
    </pattern>

    <!-- Lantern Glow Filter -->
    <filter id="lanternGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    .pirate-serif { font-family: "Georgia", "Palatino", "Times New Roman", serif; font-weight: 700; letter-spacing: 2px; fill: #F5EBD5; }
    .parchment-mono { font-family: ui-monospace, "SF Mono", Menlo, Consolas, "Courier New", monospace; }
    .gold-label { font-size: 10px; font-weight: 700; letter-spacing: 1.5px; fill: #D6AD60; }
    .parchment-sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13.5px; font-weight: 500; fill: #E8D8B5; }
    .coord-val { font-size: 11.5px; font-weight: 600; fill: #C9B896; }
  </style>

  <!-- Outer Wooden & Gold Container -->
  <rect width="876" height="216" x="2" y="2" rx="10" fill="url(#oceanDeep)" stroke="url(#borderGild)" stroke-width="2"/>
  <rect width="864" height="204" x="8" y="8" rx="8" fill="none" stroke="#D6AD60" stroke-width="0.75" stroke-opacity="0.4" stroke-dasharray="8 4"/>

  <!-- Chart Grid Overlay -->
  <rect width="860" height="200" x="10" y="10" rx="7" fill="url(#chartGrid)"/>

  <!-- Corner Brass Rivets -->
  <circle cx="16" cy="16" r="3" fill="#D6AD60" stroke="#422B20" stroke-width="0.75"/>
  <circle cx="864" cy="16" r="3" fill="#D6AD60" stroke="#422B20" stroke-width="0.75"/>
  <circle cx="16" cy="204" r="3" fill="#D6AD60" stroke="#422B20" stroke-width="0.75"/>
  <circle cx="864" cy="204" r="3" fill="#D6AD60" stroke="#422B20" stroke-width="0.75"/>

  <!-- Top Ribbon: Captain's Dispatch -->
  <g transform="translate(36, 26)">
    <rect width="330" height="24" rx="12" fill="#0B1922" stroke="#D6AD60" stroke-width="1" stroke-opacity="0.6"/>
    <!-- Glowing Stern Lantern Indicator -->
    <circle cx="14" cy="12" r="4.5" fill="#D6AD60" filter="url(#lanternGlow)">
      <animate attributeName="opacity" values="0.7;1;0.7" dur="2.4s" repeatCount="indefinite"/>
      <animate attributeName="r" values="4;5;4" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <text x="28" y="15.5" class="parchment-mono" font-size="10px" font-weight="700" letter-spacing="1.2px" fill="#D6AD60">CAPTAIN&#x27;S LOG &#x2022; IRFAN.EXE ARCHIVE</text>
  </g>

  <!-- Coordinates & Academic Base (Top Right) -->
  <g transform="translate(585, 26)">
    <rect width="255" height="24" rx="12" fill="#0B1922" stroke="#1D6465" stroke-width="1" stroke-opacity="0.7"/>
    <text x="14" y="15.5" class="parchment-mono" font-size="10px" font-weight="700" letter-spacing="0.8px" fill="#E8D8B5">PRESIDENCY UNIV &#x2022; 2025–2029</text>
  </g>

  <!-- Main Hero Titles -->
  <text x="36" y="92" class="pirate-serif" font-size="32">SHAIK IRFAN</text>
  <text x="36" y="116" class="parchment-mono gold-label" font-size="11.5">THE DEVELOPER BEHIND THE TREASURE</text>

  <!-- Voyage Tagline -->
  <text x="36" y="142" class="parchment-sub">
    Computer Science Student &amp; AI Engineer &#x2022; Architecting Verifiable Software &amp; Intelligent Systems
  </text>

  <!-- Gold Inlay Separator Line -->
  <line x1="36" y1="156" x2="570" y2="156" stroke="#422B20" stroke-width="1.2"/>
  <line x1="36" y1="156" x2="220" y2="156" stroke="url(#antiqueGold)" stroke-width="1.6"/>

  <!-- Ship's Telemetry & Sea Manifest -->
  <g transform="translate(36, 172)">
    <!-- Column 1 -->
    <text x="0" y="10" class="parchment-mono gold-label">SECTOR</text>
    <text x="0" y="26" class="parchment-mono coord-val">&#x2693; Bengaluru &#x2022; 13&#xB0;09&#x27;N, 77&#xB0;34&#x27;E</text>

    <!-- Column 2 -->
    <text x="210" y="10" class="parchment-mono gold-label">CARGO DISCIPLINE</text>
    <text x="210" y="26" class="parchment-mono coord-val">&#x2747; Deterministic RAG &amp; Applied AI</text>

    <!-- Column 3 -->
    <text x="430" y="10" class="parchment-mono gold-label">EXPEDITION STATUS</text>
    <text x="430" y="26" class="parchment-mono coord-val">&#x2694; Unlocking Summer 2027 Internships</text>
  </g>

  <!-- ================================================================= -->
  <!-- VINTAGE BRASS COMPASS ROSE & ASTROLABE (ANIMATED ROTATING EMBLEM) -->
  <!-- Center: cx="735", cy="120"                                        -->
  <!-- ================================================================= -->
  <g transform="translate(735, 120)">
    <!-- Ambient Ocean Backlight Glow -->
    <circle cx="0" cy="0" r="70" fill="#1D6465" fill-opacity="0.18"/>

    <!-- Outer Degree Ring (Rotates Slow Clockwise like an Astrolabe) -->
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="40s" repeatCount="indefinite"/>
      <circle cx="0" cy="0" r="66" stroke="#D6AD60" stroke-width="1.5" stroke-dasharray="3 3"/>
      <circle cx="0" cy="0" r="72" stroke="#422B20" stroke-width="1"/>
      <circle cx="0" cy="0" r="58" stroke="#D6AD60" stroke-width="0.75" stroke-opacity="0.6"/>

      <!-- Degree Ticks -->
      <line x1="0" y1="-66" x2="0" y2="-58" stroke="#D6AD60" stroke-width="1.5"/>
      <line x1="66" y1="0" x2="58" y2="0" stroke="#D6AD60" stroke-width="1.5"/>
      <line x1="0" y1="66" x2="0" y2="58" stroke="#D6AD60" stroke-width="1.5"/>
      <line x1="-66" y1="0" x2="-58" y2="0" stroke="#D6AD60" stroke-width="1.5"/>
      <line x1="46.6" y1="-46.6" x2="41" y2="-41" stroke="#D6AD60" stroke-width="1"/>
      <line x1="-46.6" y1="-46.6" x2="-41" y2="-41" stroke="#D6AD60" stroke-width="1"/>
      <line x1="46.6" y1="46.6" x2="41" y2="41" stroke="#D6AD60" stroke-width="1"/>
      <line x1="-46.6" y1="46.6" x2="-41" y2="41" stroke="#D6AD60" stroke-width="1"/>
    </g>

    <!-- 8-Point Compass Rose (Inner Star) -->
    <g>
      <!-- North Pointer (Gold & Dark Shading) -->
      <polygon points="0,0 -8,-22 0,-52" fill="#D6AD60"/>
      <polygon points="0,0 8,-22 0,-52" fill="#8C6A2E"/>

      <!-- South Pointer -->
      <polygon points="0,0 -8,22 0,52" fill="#8C6A2E"/>
      <polygon points="0,0 8,22 0,52" fill="#D6AD60"/>

      <!-- East Pointer -->
      <polygon points="0,0 22,-8 52,0" fill="#D6AD60"/>
      <polygon points="0,0 22,8 52,0" fill="#8C6A2E"/>

      <!-- West Pointer -->
      <polygon points="0,0 -22,-8 -52,0" fill="#8C6A2E"/>
      <polygon points="0,0 -22,8 -52,0" fill="#D6AD60"/>

      <!-- 4 Diagonal Small Pointers -->
      <g transform="rotate(45)">
        <polygon points="0,0 -5,-16 0,-36" fill="#C59B46"/>
        <polygon points="0,0 5,-16 0,-36" fill="#6A4E20"/>
        <polygon points="0,0 -5,16 0,36" fill="#6A4E20"/>
        <polygon points="0,0 5,16 0,36" fill="#C59B46"/>
        <polygon points="0,0 16,-5 36,0" fill="#C59B46"/>
        <polygon points="0,0 16,5 36,0" fill="#6A4E20"/>
        <polygon points="0,0 -16,-5 -36,0" fill="#6A4E20"/>
        <polygon points="0,0 -16,5 -36,0" fill="#C59B46"/>
      </g>
    </g>

    <!-- Center Brass Pivot Pin -->
    <circle cx="0" cy="0" r="7" fill="#422B20" stroke="#D6AD60" stroke-width="1.5"/>
    <circle cx="0" cy="0" r="3" fill="#D6AD60"/>

    <!-- Cardinal Direction Labels -->
    <text x="0" y="-72" text-anchor="middle" class="parchment-mono" font-size="9" font-weight="800" fill="#D6AD60">N</text>
    <text x="80" y="3" text-anchor="middle" class="parchment-mono" font-size="9" font-weight="800" fill="#D6AD60">E</text>
    <text x="0" y="80" text-anchor="middle" class="parchment-mono" font-size="9" font-weight="800" fill="#D6AD60">S</text>
    <text x="-80" y="3" text-anchor="middle" class="parchment-mono" font-size="9" font-weight="800" fill="#D6AD60">W</text>
  </g>
</svg>
