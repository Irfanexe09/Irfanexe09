<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 240" width="100%" height="240" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="gameBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#08070E"/>
      <stop offset="50%" stop-color="#0F0C1B"/>
      <stop offset="100%" stop-color="#08070F"/>
    </linearGradient>

    <!-- Snake Neon Body Gradient -->
    <linearGradient id="snakeNeon" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F5D4"/>
      <stop offset="40%" stop-color="#05FFA1"/>
      <stop offset="75%" stop-color="#FFD000"/>
      <stop offset="100%" stop-color="#FF5400"/>
    </linearGradient>

    <!-- Dot Spark Gradient -->
    <radialGradient id="dotPulse" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFD000" stop-opacity="1"/>
      <stop offset="50%" stop-color="#FF5400" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#FF5400" stop-opacity="0"/>
    </radialGradient>

    <!-- Border Glow Gradient -->
    <linearGradient id="borderGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F5D4" stop-opacity="0.7"/>
      <stop offset="35%" stop-color="#FF9E00" stop-opacity="0.4"/>
      <stop offset="70%" stop-color="#9D4EDD" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#00F5D4" stop-opacity="0.7"/>
    </linearGradient>

    <!-- Neon Glow Filter -->
    <filter id="neon" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Grid Pattern -->
    <pattern id="pixelGrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <rect width="18" height="18" rx="3" fill="#140E26" fill-opacity="0.6"/>
    </pattern>
  </defs>

  <style>
    .game-mono { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
    .title-hud { font-size: 11px; font-weight: 800; letter-spacing: 1.5px; fill: #00F5D4; }
    .score-txt { font-size: 12px; font-weight: 700; letter-spacing: 1px; fill: #FFB703; }
  </style>

  <!-- Container & Grid -->
  <rect width="848" height="238" x="1" y="1" rx="12" fill="url(#gameBg)" stroke="url(#borderGlow)" stroke-width="1.6"/>

  <!-- Telemetry Header Row -->
  <g transform="translate(25, 20)">
    <!-- Retro Screen Indicator -->
    <rect width="800" height="30" rx="6" fill="#120A24" stroke="#2E1B4E" stroke-width="1"/>
    
    <!-- Status Icon -->
    <circle cx="18" cy="15" r="4.5" fill="#00F5D4">
      <animate attributeName="opacity" values="1;0.2;1" dur="1.2s" repeatCount="indefinite"/>
    </circle>
    <text x="32" y="19" class="game-mono title-hud">&#x25C7; AGAMOTTO MATRIX // MULTIVERSE SNAKE RUNNER</text>

    <!-- Dynamic Score Counter -->
    <g transform="translate(560, 0)">
      <text x="0" y="19" class="game-mono score-txt">REALITY ORBS: <tspan fill="#00F5D4">28</tspan></text>
      <text x="145" y="19" class="game-mono" font-size="11px" font-weight="700" fill="#E0AAFF">SCORE: 2,840</text>
    </g>
  </g>

  <!-- Game Arena Grid -->
  <g transform="translate(25, 62)">
    <!-- Arena Background Grid -->
    <rect width="800" height="154" rx="8" fill="#0B0817" stroke="#1F1538" stroke-width="1"/>
    <rect width="800" height="154" rx="8" fill="url(#pixelGrid)"/>

    <!-- Ambient Grid Dots (Inactive Nodes) -->
    <g fill="#1F1538" opacity="0.6">
      <circle cx="60" cy="40" r="2.5"/><circle cx="100" cy="40" r="2.5"/><circle cx="140" cy="40" r="2.5"/>
      <circle cx="180" cy="40" r="2.5"/><circle cx="220" cy="40" r="2.5"/><circle cx="260" cy="40" r="2.5"/>
      <circle cx="300" cy="40" r="2.5"/><circle cx="340" cy="40" r="2.5"/><circle cx="380" cy="40" r="2.5"/>
      <circle cx="420" cy="40" r="2.5"/><circle cx="460" cy="40" r="2.5"/><circle cx="500" cy="40" r="2.5"/>
      <circle cx="540" cy="40" r="2.5"/><circle cx="580" cy="40" r="2.5"/><circle cx="620" cy="40" r="2.5"/>
      <circle cx="660" cy="40" r="2.5"/><circle cx="700" cy="40" r="2.5"/><circle cx="740" cy="40" r="2.5"/>
      
      <circle cx="60" cy="80" r="2.5"/><circle cx="100" cy="80" r="2.5"/><circle cx="140" cy="80" r="2.5"/>
      <circle cx="180" cy="80" r="2.5"/><circle cx="220" cy="80" r="2.5"/><circle cx="260" cy="80" r="2.5"/>
      <circle cx="300" cy="80" r="2.5"/><circle cx="340" cy="80" r="2.5"/><circle cx="380" cy="80" r="2.5"/>
      <circle cx="420" cy="80" r="2.5"/><circle cx="460" cy="80" r="2.5"/><circle cx="500" cy="80" r="2.5"/>
      <circle cx="540" cy="80" r="2.5"/><circle cx="580" cy="80" r="2.5"/><circle cx="620" cy="80" r="2.5"/>
      <circle cx="660" cy="80" r="2.5"/><circle cx="700" cy="80" r="2.5"/><circle cx="740" cy="80" r="2.5"/>

      <circle cx="60" cy="120" r="2.5"/><circle cx="100" cy="120" r="2.5"/><circle cx="140" cy="120" r="2.5"/>
      <circle cx="180" cy="120" r="2.5"/><circle cx="220" cy="120" r="2.5"/><circle cx="260" cy="120" r="2.5"/>
      <circle cx="300" cy="120" r="2.5"/><circle cx="340" cy="120" r="2.5"/><circle cx="380" cy="120" r="2.5"/>
      <circle cx="420" cy="120" r="2.5"/><circle cx="460" cy="120" r="2.5"/><circle cx="500" cy="120" r="2.5"/>
      <circle cx="540" cy="120" r="2.5"/><circle cx="580" cy="120" r="2.5"/><circle cx="620" cy="120" r="2.5"/>
      <circle cx="660" cy="120" r="2.5"/><circle cx="700" cy="120" r="2.5"/><circle cx="740" cy="120" r="2.5"/>
    </g>

    <!-- ============================================================== -->
    <!-- TARGET DOTS TO BE EATEN (WITH PULSE & CONSUMPTION ANIMATION)    -->
    <!-- ============================================================== -->
    
    <!-- Target Dot 1 at (260, 40) - Eaten around 1.8s into 6s cycle -->
    <g transform="translate(260, 40)">
      <circle cx="0" cy="0" r="6" fill="#FFD000" filter="url(#neon)">
        <animate attributeName="r" values="5;7;5" dur="0.8s" repeatCount="indefinite"/>
      </circle>
      <circle cx="0" cy="0" r="14" fill="url(#dotPulse)">
        <animate attributeName="opacity" values="0.8;0.2;0.8" dur="1s" repeatCount="indefinite"/>
      </circle>
      <!-- Spark flash on consumption -->
      <circle cx="0" cy="0" r="0" fill="#00F5D4" opacity="0">
        <animate attributeName="r" values="0;22;0" keyTimes="0;0.3;1" dur="6s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;0.9;0" keyTimes="0;0.3;1" dur="6s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- Target Dot 2 at (540, 80) - Eaten around 3.6s into 6s cycle -->
    <g transform="translate(540, 80)">
      <circle cx="0" cy="0" r="6" fill="#05FFA1" filter="url(#neon)">
        <animate attributeName="r" values="5;7.5;5" dur="1s" repeatCount="indefinite"/>
      </circle>
      <circle cx="0" cy="0" r="14" fill="#05FFA1" opacity="0.3">
        <animate attributeName="opacity" values="0.4;0.1;0.4" dur="1.2s" repeatCount="indefinite"/>
      </circle>
      <!-- Burst on eat -->
      <circle cx="0" cy="0" r="0" fill="#FFB703" opacity="0">
        <animate attributeName="r" values="0;20;0" keyTimes="0;0.6;1" dur="6s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;0.85;0" keyTimes="0;0.6;1" dur="6s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- Target Dot 3 at (680, 40) - Pulsing awaiting next cycle -->
    <g transform="translate(680, 40)">
      <circle cx="0" cy="0" r="5" fill="#FF5400" filter="url(#neon)"/>
      <circle cx="0" cy="0" r="12" fill="#FF9E00" opacity="0.25">
        <animate attributeName="r" values="10;14;10" dur="1.5s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- Target Dot 4 at (180, 120) - Bonus Time Stone orb -->
    <g transform="translate(180, 120)">
      <circle cx="0" cy="0" r="5.5" fill="#00F5D4" filter="url(#neon)"/>
      <circle cx="0" cy="0" r="13" fill="#00F5D4" opacity="0.2">
        <animate attributeName="opacity" values="0.5;0.1;0.5" dur="1.8s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- ============================================================== -->
    <!-- ANIMATED SNAKE: BODY & GLOWING TRAIL MOVING ACROSS GRID        -->
    <!-- Loop: Traverses (40,40) -> (260,40 eats dot) -> (420,40) ->    -->
    <!-- (420,80) -> (540,80 eats dot) -> (660,80) -> (660,120) -> ...  -->
    <!-- ============================================================== -->

    <!-- Neon Snake Path (Dashed Animation simulating serpentine movement) -->
    <path d="M 40,40 L 420,40 L 420,80 L 660,80 L 660,120 L 320,120 L 320,80 L 100,80 L 100,40"
          fill="none"
          stroke="url(#snakeNeon)"
          stroke-width="10"
          stroke-linecap="round"
          stroke-linejoin="round"
          filter="url(#neon)"
          stroke-dasharray="140 1200">
      <animate attributeName="stroke-dashoffset" values="0; -1340" dur="6s" repeatCount="indefinite"/>
    </path>

    <!-- Inner Core Bright Spine -->
    <path d="M 40,40 L 420,40 L 420,80 L 660,80 L 660,120 L 320,120 L 320,80 L 100,80 L 100,40"
          fill="none"
          stroke="#FFFFFF"
          stroke-width="3"
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-dasharray="120 1220">
      <animate attributeName="stroke-dashoffset" values="0; -1340" dur="6s" repeatCount="indefinite"/>
    </path>

    <!-- Snake Head (Glowing Time Stone Eye leading the charge) -->
    <circle r="6" fill="#00F5D4" filter="url(#neon)">
      <animateMotion path="M 40,40 L 420,40 L 420,80 L 660,80 L 660,120 L 320,120 L 320,80 L 100,80 L 100,40"
                     dur="6s"
                     repeatCount="indefinite"/>
      <animate attributeName="r" values="5.5;7.5;5.5" dur="0.8s" repeatCount="indefinite"/>
    </circle>

    <!-- Corner Decorative Tao Mandala Glyphs -->
    <g transform="translate(768, 25)" opacity="0.75">
      <circle cx="0" cy="0" r="12" stroke="#FF9E00" stroke-width="1" stroke-dasharray="4 2">
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="6s" repeatCount="indefinite"/>
      </circle>
      <circle cx="0" cy="0" r="3" fill="#00F5D4"/>
    </g>

    <g transform="translate(768, 128)" opacity="0.75">
      <circle cx="0" cy="0" r="12" stroke="#9D4EDD" stroke-width="1" stroke-dasharray="4 2">
        <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="6s" repeatCount="indefinite"/>
      </circle>
      <circle cx="0" cy="0" r="3" fill="#FFD000"/>
    </g>

    <!-- Footer Banner in Arena -->
    <text x="32" y="142" class="game-mono" font-size="9.5px" font-weight="600" fill="#64748B" letter-spacing="1.2px">
      [ARROW KEYS // AUTONOMOUS RUNNER] &#x2022; FEEDING UPON REALITY PARTICLES &#x2022; AGAMOTTO CORE SYNCHRONIZED
    </text>
  </g>
</svg>
